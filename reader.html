<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Reader — code review on the go</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/tomorrow-night.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/swift.min.js"></script>
<style>
  :root {
    --bg: #14171c;
    --surface: #1b1f27;
    --surface-raised: #232833;
    --border: #2c313d;
    --text: #e7e9ee;
    --text-dim: #8891a0;
    --text-faint: #5b6373;
    --accent: #6fbf9d;
    --accent-dim: #4c8a73;
    --danger: #c97a7a;
    --code-size: 15px;
    --ui-font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    --mono-font: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--ui-font);
    overscroll-behavior-y: none;
  }
  body { display: flex; flex-direction: column; }
  ::selection { background: rgba(111,191,157,0.28); }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .crumbs {
    display: flex; align-items: center; gap: 6px;
    overflow-x: auto; white-space: nowrap;
    font-size: 13px; color: var(--text-dim);
    scrollbar-width: none;
  }
  .crumbs::-webkit-scrollbar { display: none; }
  .crumbs button {
    background: none; border: none; color: var(--text-dim);
    font-family: var(--ui-font); font-size: 13px; padding: 4px 2px;
    cursor: pointer;
  }
  .crumbs button:last-child { color: var(--text); font-weight: 600; }
  .crumbs .sep { color: var(--text-faint); }
  .crumbs button.home { color: var(--accent); font-weight: 600; }

  .headerRow { display: flex; align-items: center; gap: 8px; }
  .searchBox {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; display: flex; align-items: center; gap: 6px;
  }
  .searchBox input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: var(--ui-font); font-size: 14px;
  }
  .searchBox input::placeholder { color: var(--text-faint); }
  .iconBtn {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text-dim); width: 34px; height: 34px; flex: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 14px;
  }
  .iconBtn:active { background: var(--surface-raised); }
  .fontStepper {
    display: flex; align-items: center; border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; flex: none;
  }
  .fontStepper button {
    background: var(--bg); border: none; color: var(--text-dim);
    width: 30px; height: 34px; font-size: 13px; cursor: pointer; font-family: var(--ui-font);
  }
  .fontStepper button:active { background: var(--surface-raised); }
  .fontStepper .divider { width: 1px; background: var(--border); height: 20px; }

  /* ---------- Main ---------- */
  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* Setup / empty state */
  .setupWrap {
    max-width: 460px; margin: 0 auto; padding: 40px 20px;
    display: flex; flex-direction: column; gap: 22px;
  }
  .brand { display: flex; flex-direction: column; gap: 4px; }
  .brand .mark { font-family: var(--mono-font); color: var(--accent); font-size: 13px; }
  .brand h1 { font-size: 26px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .brand p { margin: 0; color: var(--text-dim); font-size: 14px; line-height: 1.5; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; color: var(--text-dim); }
  .field input {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 11px 12px; color: var(--text); font-family: var(--ui-font); font-size: 15px; outline: none;
  }
  .field input:focus { border-color: var(--accent-dim); }
  .field .hint { font-size: 12px; color: var(--text-faint); line-height: 1.5; }
  .primaryBtn {
    background: var(--accent); color: #0f1512; border: none; border-radius: 8px;
    padding: 12px 16px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--ui-font);
  }
  .primaryBtn:active { background: var(--accent-dim); }
  .primaryBtn:disabled { opacity: 0.5; }
  .textBtn {
    background: none; border: none; color: var(--accent); font-size: 13px; cursor: pointer;
    padding: 4px 0; text-align: left; font-family: var(--ui-font);
  }
  .recentRow {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; cursor: pointer;
  }
  .recentRow:active { background: var(--surface-raised); }
  .recentRow span { font-family: var(--mono-font); font-size: 13px; }

  /* Repo / tree list */
  .listWrap { padding: 6px 0 24px; }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .row:active { background: var(--surface); }
  .row .glyph {
    width: 20px; text-align: center; font-size: 14px; color: var(--text-faint); flex: none;
  }
  .row.dir .glyph { color: var(--accent); }
  .row .name { font-family: var(--mono-font); font-size: 14px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { font-size: 12px; color: var(--text-faint); flex: none; }
  .sectionLabel {
    padding: 14px 14px 6px; font-size: 12px; color: var(--text-faint);
  }
  .emptyState {
    padding: 60px 24px; text-align: center; color: var(--text-dim); font-size: 14px; line-height: 1.6;
  }
  .spinner {
    padding: 40px; text-align: center; color: var(--text-dim); font-size: 13px;
  }
  .errorBox {
    margin: 14px; padding: 12px 14px; background: rgba(201,122,122,0.1);
    border: 1px solid rgba(201,122,122,0.35); border-radius: 8px;
    color: #e3aeae; font-size: 13px; line-height: 1.5;
  }

  /* File viewer */
  .fileToolbar {
    display: flex; gap: 8px; padding: 8px 12px; background: var(--surface);
    border-bottom: 1px solid var(--border); overflow-x: auto;
  }
  .fileToolbar button {
    flex: none; background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    color: var(--text-dim); font-size: 12.5px; padding: 7px 11px; cursor: pointer; font-family: var(--ui-font);
    display: flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .fileToolbar button.active { color: var(--accent); border-color: var(--accent-dim); }
  .fileToolbar button:active { background: var(--surface-raised); }

  .codeScroll { overflow-x: auto; }
  .codeScroll.wrap pre code { white-space: pre-wrap; word-break: break-word; }
  pre {
    margin: 0; padding: 12px 0 60px;
    font-family: var(--mono-font); font-size: var(--code-size); line-height: 1.65;
  }
  code.hljs { background: none !important; padding: 0 !important; }
  .lineRow {
    display: flex; user-select: text;
  }
  .lineRow.selected { background: rgba(111,191,157,0.14); }
  .lineNum {
    flex: none; width: 44px; text-align: right; padding-right: 12px;
    color: var(--text-faint); user-select: none; font-size: calc(var(--code-size) - 2px);
    -webkit-user-select: none;
  }
  .lineContent { flex: 1; padding-right: 16px; white-space: pre; }
  .codeScroll.wrap .lineContent { white-space: pre-wrap; word-break: break-word; }

  .selectionBar {
    position: fixed; left: 12px; right: 12px; bottom: 14px; z-index: 30;
    background: var(--surface-raised); border: 1px solid var(--accent-dim);
    border-radius: 10px; padding: 10px 12px;
    display: none; align-items: center; gap: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
  }
  .selectionBar.show { display: flex; }
  .selectionBar .label { flex: 1; font-size: 12.5px; color: var(--text-dim); font-family: var(--mono-font); }
  .selectionBar button {
    background: var(--accent); color: #0f1512; border: none; border-radius: 7px;
    padding: 8px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: var(--ui-font);
    white-space: nowrap;
  }
  .selectionBar button.secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .selectionBar .clear {
    background: none; color: var(--text-faint); border: none; padding: 8px; font-size: 16px;
  }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--accent); color: #0f1512; padding: 9px 16px; border-radius: 20px;
    font-size: 13px; font-weight: 600; z-index: 50; opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  footer {
    padding: 10px 14px; text-align: center; font-size: 11.5px; color: var(--text-faint);
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--text-faint); }
</style>
</head>
<body>

<header id="headerEl">
  <div class="crumbs" id="crumbs"></div>
  <div class="headerRow" id="headerRow"></div>
</header>

<main id="main"></main>

<div class="selectionBar" id="selectionBar">
  <div class="label" id="selectionLabel">0 lines selected</div>
  <button class="secondary" id="btnClearSel">Clear</button>
  <button id="btnCopySel">Copy</button>
  <button id="btnCopyClaude">Copy for Claude</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Reader — a small, single-file GitHub code viewer.
   No build step, no framework. Everything lives in this file
   so it's easy to read, fork, and deploy (e.g. to GitHub Pages).
   ============================================================ */

const state = {
  token: '',          // GitHub PAT, kept in memory only for this session
  owner: '',
  repo: '',
  branch: '',
  path: [],            // array of path segments for breadcrumbs
  tree: null,           // full recursive tree for current repo (for search)
  view: 'setup',        // setup | repos | tree | file
  fileLines: [],
  selection: { start: null, end: null },
  recents: []           // { owner, repo } most-recently opened, in memory only
};

const $ = (sel) => document.querySelector(sel);
const headerRow = $('#headerRow');
const crumbsEl = $('#crumbs');
const mainEl = $('#main');

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1600);
}

function ghHeaders() {
  const h = { 'Accept': 'application/vnd.github+json' };
  if (state.token) h['Authorization'] = 'Bearer ' + state.token;
  return h;
}

async function gh(path) {
  const res = await fetch('https://api.github.com' + path, { headers: ghHeaders() });
  if (!res.ok) {
    if (res.status === 403) throw new Error('Rate limited or blocked. Add a token to raise your limit.');
    if (res.status === 404) throw new Error('Not found. Check the owner/repo name.');
    throw new Error('GitHub API error (' + res.status + ')');
  }
  return res.json();
}

/* ---------------- Header rendering ---------------- */

function renderCrumbs() {
  crumbsEl.innerHTML = '';
  const home = document.createElement('button');
  home.className = 'home';
  home.textContent = 'reader';
  home.onclick = () => { state.view = 'setup'; render(); };
  crumbsEl.appendChild(home);

  if (state.owner) {
    addSep();
    const repoBtn = document.createElement('button');
    repoBtn.textContent = state.owner + '/' + state.repo;
    repoBtn.onclick = () => { state.path = []; state.view = 'tree'; render(); };
    crumbsEl.appendChild(repoBtn);
  }
  state.path.forEach((seg, i) => {
    addSep();
    const b = document.createElement('button');
    b.textContent = seg;
    b.onclick = () => {
      state.path = state.path.slice(0, i + 1);
      state.view = 'tree';
      render();
    };
    crumbsEl.appendChild(b);
  });

  function addSep() {
    const s = document.createElement('span');
    s.className = 'sep';
    s.textContent = '/';
    crumbsEl.appendChild(s);
  }
}

function renderHeaderRow() {
  headerRow.innerHTML = '';
  if (state.view === 'setup') return;

  if (state.view === 'repos' || state.view === 'tree') {
    const box = document.createElement('div');
    box.className = 'searchBox';
    box.innerHTML = '<span style="color:var(--text-faint);font-size:13px;">⌕</span>';
    const input = document.createElement('input');
    input.placeholder = state.view === 'repos' ? 'Filter repos' : 'Go to file';
    input.value = state.filterQuery || '';
    input.oninput = (e) => { state.filterQuery = e.target.value; renderMain(); };
    box.appendChild(input);
    headerRow.appendChild(box);

    const settingsBtn = document.createElement('button');
    settingsBtn.className = 'iconBtn';
    settingsBtn.textContent = '⚙';
    settingsBtn.onclick = () => { state.view = 'setup'; render(); };
    headerRow.appendChild(settingsBtn);
  }

  if (state.view === 'file') {
    const back = document.createElement('button');
    back.className = 'iconBtn';
    back.textContent = '←';
    back.onclick = () => { state.view = 'tree'; render(); };
    headerRow.appendChild(back);

    const stepper = document.createElement('div');
    stepper.className = 'fontStepper';
    const minus = document.createElement('button');
    minus.textContent = 'A−';
    minus.onclick = () => adjustFont(-1);
    const plus = document.createElement('button');
    plus.textContent = 'A+';
    plus.onclick = () => adjustFont(1);
    const div = document.createElement('div');
    div.className = 'divider';
    stepper.appendChild(minus); stepper.appendChild(div); stepper.appendChild(plus);
    headerRow.appendChild(stepper);

    const wrapBtn = document.createElement('button');
    wrapBtn.className = 'iconBtn';
    wrapBtn.textContent = '⇥';
    wrapBtn.title = 'Toggle wrap';
    wrapBtn.style.color = state.wrap ? 'var(--accent)' : 'var(--text-dim)';
    wrapBtn.onclick = () => { state.wrap = !state.wrap; render(); };
    headerRow.appendChild(wrapBtn);

    const copyBtn = document.createElement('button');
    copyBtn.className = 'iconBtn';
    copyBtn.textContent = '⎘';
    copyBtn.title = 'Copy whole file';
    copyBtn.onclick = () => copyText(state.fileLines.join('\n'), 'File copied');
    headerRow.appendChild(copyBtn);
  }
}

let fontSize = 15;
function adjustFont(delta) {
  fontSize = Math.min(22, Math.max(11, fontSize + delta));
  document.documentElement.style.setProperty('--code-size', fontSize + 'px');
}

/* ---------------- Main views ---------------- */

function render() {
  renderCrumbs();
  renderHeaderRow();
  renderMain();
}

function renderMain() {
  mainEl.innerHTML = '';
  mainEl.scrollTop = 0;
  if (state.view === 'setup') return renderSetup();
  if (state.view === 'repos') return renderRepos();
  if (state.view === 'tree') return renderTree();
  if (state.view === 'file') return renderFile();
}

function renderSetup() {
  const wrap = document.createElement('div');
  wrap.className = 'setupWrap';
  wrap.innerHTML = `
    <div class="brand">
      <div class="mark">reader/</div>
      <h1>Read code, not chrome.</h1>
      <p>Browse any GitHub repo in a view built for a phone screen: big type, real line numbers, and a copy button that actually gets you what you meant to copy.</p>
    </div>
    <div class="field">
      <label>GitHub username or org</label>
      <input id="ownerInput" placeholder="e.g. arturoa925" autocapitalize="off" autocorrect="off" />
    </div>
    <div class="field">
      <label>Personal access token — optional</label>
      <input id="tokenInput" type="password" placeholder="Only needed for private repos" autocapitalize="off" autocorrect="off" />
      <div class="hint">Kept in this tab's memory only — never saved, never sent anywhere but api.github.com. Closing the tab clears it. Create one at github.com/settings/tokens with just the "repo" scope.</div>
    </div>
    <button class="primaryBtn" id="loadReposBtn">Load repos</button>
    <button class="textBtn" id="directRepoToggle">Or open a specific repo directly →</button>
    <div id="directRepoFields" style="display:none;flex-direction:column;gap:12px;">
      <div class="field">
        <label>owner/repo</label>
        <input id="directRepoInput" placeholder="e.g. arturoa925/daily-brief" autocapitalize="off" autocorrect="off" />
      </div>
      <button class="primaryBtn" id="openDirectBtn">Open repo</button>
    </div>
    <div id="recentsWrap"></div>
  `;
  mainEl.appendChild(wrap);

  $('#tokenInput').value = state.token;
  $('#ownerInput').value = state.owner && !state.repo ? state.owner : (state.lastOwnerInput || '');

  $('#directRepoToggle').onclick = () => {
    const f = $('#directRepoFields');
    f.style.display = f.style.display === 'none' ? 'flex' : 'none';
  };
  $('#openDirectBtn').onclick = () => {
    state.token = $('#tokenInput').value.trim();
    const val = $('#directRepoInput').value.trim();
    const [owner, repo] = val.split('/');
    if (!owner || !repo) return toast('Enter it as owner/repo');
    openRepo(owner, repo);
  };
  $('#loadReposBtn').onclick = () => {
    state.token = $('#tokenInput').value.trim();
    const owner = $('#ownerInput').value.trim();
    if (!owner) return toast('Enter a username or org');
    state.lastOwnerInput = owner;
    loadRepos(owner);
  };

  if (state.recents.length) {
    const rWrap = $('#recentsWrap');
    rWrap.style.cssText = 'display:flex;flex-direction:column;gap:8px;margin-top:6px;';
    const label = document.createElement('div');
    label.style.cssText = 'font-size:12px;color:var(--text-faint);';
    label.textContent = 'Recent';
    rWrap.appendChild(label);
    state.recents.forEach(r => {
      const row = document.createElement('div');
      row.className = 'recentRow';
      row.innerHTML = `<span>${r.owner}/${r.repo}</span><span style="color:var(--text-faint);font-size:12px;">open →</span>`;
      row.onclick = () => { state.token = $('#tokenInput').value.trim(); openRepo(r.owner, r.repo); };
      rWrap.appendChild(row);
    });
  }
}

async function loadRepos(owner) {
  mainEl.innerHTML = '<div class="spinner">Loading repos…</div>';
  try {
    let repos;
    try {
      repos = await gh(`/users/${owner}/repos?per_page=100&sort=updated`);
    } catch (e) {
      repos = await gh(`/orgs/${owner}/repos?per_page=100&sort=updated`);
    }
    state.owner = owner;
    state.repo = '';
    state.repos = repos;
    state.view = 'repos';
    render();
  } catch (e) {
    mainEl.innerHTML = `<div class="errorBox">${e.message}</div>`;
  }
}

function renderRepos() {
  const q = (state.filterQuery || '').toLowerCase();
  const list = (state.repos || []).filter(r => r.name.toLowerCase().includes(q));
  const wrap = document.createElement('div');
  wrap.className = 'listWrap';
  if (!list.length) {
    wrap.innerHTML = '<div class="emptyState">No repos match.</div>';
  } else {
    list.forEach(r => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<span class="glyph">◎</span><span class="name">${r.name}</span><span class="meta">${r.language || ''}</span>`;
      row.onclick = () => openRepo(state.owner, r.name, r.default_branch);
      wrap.appendChild(row);
    });
  }
  mainEl.appendChild(wrap);
}

async function openRepo(owner, repo, branch) {
  mainEl.innerHTML = '<div class="spinner">Loading ' + owner + '/' + repo + '…</div>';
  try {
    let b = branch;
    if (!b) {
      const info = await gh(`/repos/${owner}/${repo}`);
      b = info.default_branch;
    }
    const treeRes = await gh(`/repos/${owner}/${repo}/git/trees/${b}?recursive=1`);
    state.owner = owner;
    state.repo = repo;
    state.branch = b;
    state.tree = treeRes.tree.filter(t => t.type === 'blob');
    state.path = [];
    state.view = 'tree';
    state.filterQuery = '';
    if (!state.recents.find(r => r.owner === owner && r.repo === repo)) {
      state.recents.unshift({ owner, repo });
      state.recents = state.recents.slice(0, 6);
    }
    render();
  } catch (e) {
    mainEl.innerHTML = `<div class="errorBox">${e.message}</div>`;
  }
}

function renderTree() {
  const q = (state.filterQuery || '').toLowerCase();
  const wrap = document.createElement('div');
  wrap.className = 'listWrap';

  if (q) {
    const matches = state.tree.filter(t => t.path.toLowerCase().includes(q)).slice(0, 60);
    const label = document.createElement('div');
    label.className = 'sectionLabel';
    label.textContent = matches.length + ' match' + (matches.length === 1 ? '' : 'es');
    wrap.appendChild(label);
    matches.forEach(t => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<span class="glyph">◇</span><span class="name">${t.path}</span>`;
      row.onclick = () => openFile(t.path);
      wrap.appendChild(row);
    });
    mainEl.appendChild(wrap);
    return;
  }

  const prefix = state.path.length ? state.path.join('/') + '/' : '';
  const seen = new Set();
  const entries = [];
  state.tree.forEach(t => {
    if (!t.path.startsWith(prefix)) return;
    const rest = t.path.slice(prefix.length);
    if (!rest) return;
    const slash = rest.indexOf('/');
    if (slash === -1) {
      entries.push({ type: 'file', name: rest, full: t.path });
    } else {
      const dirName = rest.slice(0, slash);
      if (!seen.has(dirName)) {
        seen.add(dirName);
        entries.push({ type: 'dir', name: dirName, full: prefix + dirName });
      }
    }
  });
  entries.sort((a, b) => (a.type === b.type ? a.name.localeCompare(b.name) : a.type === 'dir' ? -1 : 1));

  if (!entries.length) {
    wrap.innerHTML = '<div class="emptyState">Empty folder.</div>';
  } else {
    entries.forEach(e => {
      const row = document.createElement('div');
      row.className = 'row' + (e.type === 'dir' ? ' dir' : '');
      row.innerHTML = `<span class="glyph">${e.type === 'dir' ? '▸' : '◇'}</span><span class="name">${e.name}</span>`;
      row.onclick = () => {
        if (e.type === 'dir') {
          state.path = e.full.split('/');
          render();
        } else {
          openFile(e.full);
        }
      };
      wrap.appendChild(row);
    });
  }
  mainEl.appendChild(wrap);
}

async function openFile(path) {
  mainEl.innerHTML = '<div class="spinner">Loading ' + path + '…</div>';
  try {
    const url = `https://raw.githubusercontent.com/${state.owner}/${state.repo}/${state.branch}/${path}`;
    const res = await fetch(url, state.token ? { headers: { Authorization: 'Bearer ' + state.token } } : {});
    if (!res.ok) throw new Error('Could not load file (' + res.status + ')');
    const text = await res.text();
    state.currentPath = path;
    state.fileLines = text.split('\n');
    state.path = path.split('/').slice(0, -1);
    state.selection = { start: null, end: null };
    state.view = 'file';
    render();
  } catch (e) {
    mainEl.innerHTML = `<div class="errorBox">${e.message}</div>`;
  }
}

function langFromPath(path) {
  const ext = path.split('.').pop().toLowerCase();
  const map = {
    swift: 'swift', js: 'javascript', jsx: 'javascript', ts: 'typescript', tsx: 'typescript',
    py: 'python', rb: 'ruby', go: 'go', rs: 'rust', java: 'java', kt: 'kotlin', c: 'c', h: 'c',
    cpp: 'cpp', hpp: 'cpp', cs: 'csharp', m: 'objectivec', mm: 'objectivec', json: 'json',
    yml: 'yaml', yaml: 'yaml', md: 'markdown', html: 'xml', css: 'css', sh: 'bash', sql: 'sql'
  };
  return map[ext] || 'plaintext';
}

function renderFile() {
  const scrollWrap = document.createElement('div');
  scrollWrap.className = 'codeScroll' + (state.wrap ? ' wrap' : '');

  const pre = document.createElement('pre');
  const lang = langFromPath(state.currentPath);

  state.fileLines.forEach((line, idx) => {
    const lineRow = document.createElement('div');
    lineRow.className = 'lineRow';
    lineRow.dataset.line = idx;

    const num = document.createElement('span');
    num.className = 'lineNum';
    num.textContent = idx + 1;

    const content = document.createElement('span');
    content.className = 'lineContent';
    const codeEl = document.createElement('code');
    codeEl.className = lang;
    codeEl.textContent = line.length ? line : ' ';
    content.appendChild(codeEl);

    lineRow.appendChild(num);
    lineRow.appendChild(content);
    lineRow.onclick = () => toggleLineSelection(idx);
    pre.appendChild(lineRow);
  });

  scrollWrap.appendChild(pre);
  mainEl.appendChild(scrollWrap);

  try {
    pre.querySelectorAll('code').forEach(el => hljs.highlightElement(el));
  } catch (e) { /* highlighting is best-effort */ }

  updateSelectionUI();
}

function toggleLineSelection(idx) {
  const sel = state.selection;
  if (sel.start === null) {
    sel.start = sel.end = idx;
  } else if (idx === sel.start && sel.start === sel.end) {
    sel.start = sel.end = null;
  } else {
    if (idx < sel.start) sel.start = idx;
    else sel.end = idx;
  }
  document.querySelectorAll('.lineRow').forEach(r => {
    const i = +r.dataset.line;
    r.classList.toggle('selected', sel.start !== null && i >= sel.start && i <= sel.end);
  });
  updateSelectionUI();
}

function updateSelectionUI() {
  const bar = $('#selectionBar');
  const sel = state.selection;
  if (sel.start === null) {
    bar.classList.remove('show');
    return;
  }
  bar.classList.add('show');
  const count = sel.end - sel.start + 1;
  $('#selectionLabel').textContent = count === 1
    ? `Line ${sel.start + 1}`
    : `Lines ${sel.start + 1}–${sel.end + 1} · ${count} lines`;
}

function selectedText() {
  const sel = state.selection;
  if (sel.start === null) return '';
  return state.fileLines.slice(sel.start, sel.end + 1).join('\n');
}

function copyText(text, msg) {
  navigator.clipboard.writeText(text).then(() => toast(msg)).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast(msg);
  });
}

$('#btnClearSel').onclick = () => {
  state.selection = { start: null, end: null };
  document.querySelectorAll('.lineRow.selected').forEach(r => r.classList.remove('selected'));
  updateSelectionUI();
};

$('#btnCopySel').onclick = () => {
  const text = selectedText();
  if (!text) return;
  copyText(text, 'Selection copied');
};

$('#btnCopyClaude').onclick = () => {
  const sel = state.selection;
  const text = selectedText();
  if (!text) return;
  const rangeLabel = sel.start === sel.end ? `line ${sel.start + 1}` : `lines ${sel.start + 1}-${sel.end + 1}`;
  const prompt = [
    `File: ${state.owner}/${state.repo}/${state.currentPath} (${rangeLabel})`,
    '```' + langFromPath(state.currentPath),
    text,
    '```',
    '',
    'Question: '
  ].join('\n');
  copyText(prompt, 'Copied — paste into Claude');
};

render();
</script>

<footer>
  reads public and token-authorized repos via the GitHub API · nothing is stored server-side
</footer>
